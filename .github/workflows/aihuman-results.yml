name: AI Human Lab results reconciliation
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/results-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-human-lab-results
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_NAMESPACE: AIHUMAN
      AIHUMAN_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.AIHUMAN_GOOGLE_SERVICE_ACCOUNT_JSON }}
      AIHUMAN_YOUTUBE_CLIENT_ID: ${{ secrets.AIHUMAN_YOUTUBE_CLIENT_ID }}
      AIHUMAN_YOUTUBE_CLIENT_SECRET: ${{ secrets.AIHUMAN_YOUTUBE_CLIENT_SECRET }}
      AIHUMAN_YOUTUBE_REFRESH_TOKEN: ${{ secrets.AIHUMAN_YOUTUBE_REFRESH_TOKEN }}
      AIHUMAN_EXPECTED_CHANNEL_ID: 'UCMiOwznPHDPDlbNIQqEnNSQ'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python automation/queue_sync.py
